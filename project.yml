name: SwipeDeleteKeyboard
options:
  bundleIdPrefix: com.bigk4huna.swipedelete
  deploymentTarget:
    iOS: "16.0"

packages:
  AzooKeyKanaKanjiConverter:
    url: https://github.com/azooKey/AzooKeyKanaKanjiConverter
    minorVersion: "0.8.0"

targets:
  SwipeDeleteKeyboard:
    type: application
    platform: iOS
    sources: App
    dependencies:
      - target: KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigk4huna.swipedelete
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "48"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        DEVELOPMENT_TEAM: M4MTXQ56CT
        PROVISIONING_PROFILE: e5ceffe8-35f4-45cc-8ba2-3c1b65022f93
        PROVISIONING_PROFILE_SPECIFIER: "SwipeDeleteKeyboard AdHoc"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources: KeyboardExtension
    dependencies:
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigk4huna.swipedelete.keyboard
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "48"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        DEVELOPMENT_TEAM: M4MTXQ56CT
        PROVISIONING_PROFILE: dc4ea33f-dae7-422a-b485-615e51821c9d
        PROVISIONING_PROFILE_SPECIFIER: "SwipeDeleteKeyboard Keyboard AdHoc"
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: SwipeDelete Keyboard
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController

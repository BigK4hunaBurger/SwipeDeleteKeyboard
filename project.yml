name: SwipeDeleteKeyboard
options:
  bundleIdPrefix: com.bigk4huna.swipedelete
  deploymentTarget:
    iOS: "16.0"

targets:
  SwipeDeleteKeyboard:
    type: application
    platform: iOS
    sources: App
    dependencies:
      - target: KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigk4huna.swipedelete
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        DEVELOPMENT_TEAM: M4MTXQ56CT
        PROVISIONING_PROFILE: d70e8412-7c64-47fc-bc10-3f2aeb7d0137
        PROVISIONING_PROFILE_SPECIFIER: "SwipeDeleteKeyboard AppStore"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources: KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigk4huna.swipedelete.keyboard
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        DEVELOPMENT_TEAM: M4MTXQ56CT
        PROVISIONING_PROFILE: f9098798-096d-402d-b09b-1aafb104001c
        PROVISIONING_PROFILE_SPECIFIER: "SwipeDeleteKeyboard Keyboard AppStore"
    info:
      path: KeyboardExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-input-mode
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController

name: Build & Upload Ad Hoc IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications | grep "Xcode" | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s /Applications/$XCODE/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install certificate and profiles
        run: |
          security create-keychain -p "temp" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "${{ secrets.DISTRIBUTION_P12 }}" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.DISTRIBUTION_P12_PASSWORD }}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "temp" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.ADHOC_PROVISIONING_PROFILE }}" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/e5ceffe8-35f4-45cc-8ba2-3c1b65022f93.mobileprovision
          echo "${{ secrets.ADHOC_PROVISIONING_PROFILE_KEYBOARD }}" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/dc4ea33f-dae7-422a-b485-615e51821c9d.mobileprovision
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SwipeDeleteKeyboard.xcodeproj \
            -scheme SwipeDeleteKeyboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/SwipeDelete.xcarchive
          echo "Archive done:"
          ls -la $RUNNER_TEMP/

      - name: Export IPA
        run: |
          cat > /tmp/exportOptions.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bigk4huna.swipedelete</key>
              <string>SwipeDeleteKeyboard AdHoc</string>
              <key>com.bigk4huna.swipedelete.keyboard</key>
              <string>SwipeDeleteKeyboard Keyboard AdHoc</string>
            </dict>
          </dict>
          </plist>
          PLISTEOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SwipeDelete.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist /tmp/exportOptions.plist
          echo "Export done:"
          ls -la $RUNNER_TEMP/export/

      - name: Upload IPA to Diawi
        run: |
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -1)
          echo "IPA: $IPA_PATH"
          RESPONSE=$(curl -s -F "file=@$IPA_PATH" \
            -F "token=${{ secrets.DIAWI_TOKEN }}" \
            https://upload.diawi.com/)
          echo "Response: $RESPONSE"
          JOB=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['job'])")
          echo "Job: $JOB"
          sleep 15
          STATUS=$(curl -s "https://upload.diawi.com/status?token=${{ secrets.DIAWI_TOKEN }}&job=$JOB")
          echo "Status: $STATUS"
          LINK=$(echo $STATUS | python3 -c "import sys,json; print(json.load(sys.stdin).get('link',''))")
          echo "============================================"
          echo "Install link: $LINK"
          echo "============================================"

name: Build & Upload to TestFlight

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications | grep "Xcode" | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s /Applications/$XCODE/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install certificate and profile
        run: |
          # Create temp keychain
          security create-keychain -p "temp" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          echo "${{ secrets.DISTRIBUTION_P12 }}" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.DISTRIBUTION_P12_PASSWORD }}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "temp" build.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/d70e8412-7c64-47fc-bc10-3f2aeb7d0137.mobileprovision
          echo "${{ secrets.PROVISIONING_PROFILE_KEYBOARD }}" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/f9098798-096d-402d-b09b-1aafb104001c.mobileprovision
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SwipeDeleteKeyboard.xcodeproj \
            -scheme SwipeDeleteKeyboard \
            -configuration Release \
            -archivePath $RUNNER_TEMP/SwipeDelete.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="d70e8412-7c64-47fc-bc10-3f2aeb7d0137" \
            PROVISIONING_PROFILE_SPECIFIER="SwipeDeleteKeyboard AppStore"
          echo "Archive done:"
          ls -la $RUNNER_TEMP/

      - name: Export IPA
        run: |
          cat > /tmp/exportOptions.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bigk4huna.swipedelete</key>
              <string>SwipeDeleteKeyboard AppStore</string>
            <key>com.bigk4huna.swipedelete.keyboard</key>
              <string>SwipeDeleteKeyboard Keyboard AppStore</string>
            </dict>
          </dict>
          </plist>
          PLISTEOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SwipeDelete.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist /tmp/exportOptions.plist
          echo "Export done:"
          ls -la $RUNNER_TEMP/export/

      - name: Upload to TestFlight
        run: |
          echo "=== workspace contents ===" && ls -la
          echo "=== find ipa ===" && find . -name "*.ipa" 2>/dev/null
          mkdir -p ~/.private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -1)
          echo "IPA: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }} \
            2>&1

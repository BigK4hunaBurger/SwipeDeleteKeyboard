name: Build & Upload Ad Hoc IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications | grep "Xcode" | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s /Applications/$XCODE/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install certificate and profiles
        run: |
          security create-keychain -p "temp" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "${{ secrets.DISTRIBUTION_P12 }}" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.DISTRIBUTION_P12_PASSWORD }}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "temp" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.ADHOC_PROVISIONING_PROFILE }}" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/e5ceffe8-35f4-45cc-8ba2-3c1b65022f93.mobileprovision
          echo "${{ secrets.ADHOC_PROVISIONING_PROFILE_KEYBOARD }}" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/dc4ea33f-dae7-422a-b485-615e51821c9d.mobileprovision
          # 英語キーボード用プロビジョニングプロファイル（セットアップ後に有効になる）
          if [ -n "${{ secrets.ADHOC_PROVISIONING_PROFILE_KEYBOARD_EN }}" ]; then
            EN_UUID=$(echo "${{ secrets.ADHOC_PROVISIONING_PROFILE_KEYBOARD_EN }}" | base64 --decode | grep -a -o '[0-9a-f]\{8\}-[0-9a-f]\{4\}-[0-9a-f]\{4\}-[0-9a-f]\{4\}-[0-9a-f]\{12\}' | head -1)
            echo "${{ secrets.ADHOC_PROVISIONING_PROFILE_KEYBOARD_EN }}" | base64 --decode > \
              ~/Library/MobileDevice/Provisioning\ Profiles/${EN_UUID}.mobileprovision
            echo "EN_PROFILE_UUID=$EN_UUID" >> $GITHUB_ENV
          fi
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Update English Extension Profile UUID
        run: |
          if [ -n "$EN_PROFILE_UUID" ]; then
            sed -i '' "s/REPLACE_WITH_EN_PROFILE_UUID/${EN_PROFILE_UUID}/g" project.yml
            xcodegen generate
          fi

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SwipeDeleteKeyboard.xcodeproj \
            -scheme SwipeDeleteKeyboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/SwipeDelete.xcarchive
          echo "Archive done:"
          ls -la $RUNNER_TEMP/

      - name: Export IPA
        run: |
          cat > /tmp/exportOptions.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bigk4huna.swipedelete</key>
              <string>SwipeDeleteKeyboard AdHoc</string>
              <key>com.bigk4huna.swipedelete.keyboard</key>
              <string>SwipeDeleteKeyboard Keyboard AdHoc</string>
              <key>com.bigk4huna.swipedelete.keyboard.en</key>
              <string>SwipeDeleteKeyboard English Keyboard AdHoc</string>
            </dict>
          </dict>
          </plist>
          PLISTEOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SwipeDelete.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist /tmp/exportOptions.plist
          echo "Export done:"
          ls -la $RUNNER_TEMP/export/

      - name: Get build number
        id: buildnum
        run: |
          BUILD=$(grep 'CURRENT_PROJECT_VERSION' project.yml | head -1 | tr -d ' "' | cut -d: -f2)
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Build number: $BUILD"

      - name: Create manifest.plist
        run: |
          BUILD=${{ steps.buildnum.outputs.build }}
          IPA_URL="https://github.com/${{ github.repository }}/releases/download/build-${BUILD}/SwipeDeleteKeyboard.ipa"
          cat > $RUNNER_TEMP/export/manifest.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${IPA_URL}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>com.bigk4huna.swipedelete</string>
                  <key>bundle-version</key><string>1.0</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>SwipeDeleteKeyboard</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          echo "manifest.plist created"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD=${{ steps.buildnum.outputs.build }}
          TAG="build-${BUILD}"
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -1)
          MANIFEST_PATH=$RUNNER_TEMP/export/manifest.plist
          MANIFEST_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/manifest.plist"
          OTA_LINK="itms-services://?action=download-manifest&url=${MANIFEST_URL}"

          # 既存タグがあれば削除して再作成
          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "Build ${BUILD}" \
            --notes "OTA install: \`${OTA_LINK}\`" \
            "$IPA_PATH" \
            "$MANIFEST_PATH"

          echo "============================================"
          echo "OTA Install link:"
          echo "$OTA_LINK"
          echo "============================================"
          echo "Or open on iPhone:"
          echo "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          echo "============================================"

workflows:
  ios-keyboard:
    name: SwipeDelete Keyboard
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store        # or: ad_hoc (for TestFlight direct)
        bundle_identifier: com.bigk4huna.swipedelete
      vars:
        XCODE_SCHEME: SwipeDeleteKeyboard
        XCODE_WORKSPACE: SwipeDeleteKeyboard.xcodeproj
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install XcodeGen & generate project
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Build & Archive
        script: |
          xcodebuild \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/SwipeDeleteKeyboard.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            | xcpretty

      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/SwipeDeleteKeyboard.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/

    artifacts:
      - build/*.ipa
      - build/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
